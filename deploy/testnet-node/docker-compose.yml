# Dendra — all-in-one NODE to join a PUBLIC testnet (chain sync).
# 3 steps:  cp .env.example .env  ->  fill in GENESIS_URL + SEEDS  ->  docker compose up -d --build
#
# This node SYNCS the chain from the public seeds (it does NOT launch its own genesis). To BECOME A
# VALIDATOR (stake bond): see README.md, the manual 'create-validator' step.
#
# ── PEER REDUNDANCY: read this before you bond stake ────────────────────────────────────────────
# SEEDS and PERSISTENT_PEERS are COMMA-SEPARATED LISTS. node-join.sh writes each string verbatim
# into config.toml (`seeds = ` / `persistent_peers = `), so naming several hosts costs nothing and
# is the only thing that gives this node a second way into the network.
# As published today the operator's network-info.txt names ONE host in BOTH fields, so a node built
# from it has exactly one possible peer and no redundancy at all. Peer discovery does not repair
# that on its own: `pex` is enabled in the shipped config, and on the operator's own node it asked
# for more addresses 118 times over a 3-hour log window and learned nothing — the address book still
# held a single entry. A node that reaches only one peer misses blocks whenever that link drops, and
# on this chain 51 consecutive missed blocks are enough to jail the validator and slash 1%.
# See README.md, section "Availability and peer redundancy", for the arithmetic and the numbers.
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# ── THIS KIT USED TO HIJACK AN EXISTING NODE. Read before you change the names below ────────────
# COMPOSE KEYS A PROJECT BY NAME, NOT BY DIRECTORY. A hard-coded `name:` therefore makes every copy
# of this repository resolve to the SAME project, the SAME containers and the SAME chain-data volume:
# from a second clone, `docker compose ps` lists the node this machine is already running, and `up -d`
# does not create a second node — it RECREATES the first one, from a source tree that never started
# it, on top of its chain state and its validator key. Hence the overridable name and ports below.
# The four knobs below are therefore variables with the OLD literals as defaults: an operator who
# sets nothing keeps exactly the previous behaviour, and one who wants a second, harmless node sets
# DENDRA_PROJECT + DENDRA_P2P_PORT + DENDRA_RPC_PORT + DENDRA_NODE_IMAGE and collides with nothing.
# COMPOSE_PROJECT_NAME still overrides this field (measured on Compose v5.3.0), so the documented
# escape hatch keeps working.
# ────────────────────────────────────────────────────────────────────────────────────────────────
name: ${DENDRA_PROJECT:-dendra-node}

services:
  # ── THE GUARD. Refuses to start the node on a chain home this copy of the kit was not told to use.
  # It runs before `node` (depends_on/service_completed_successfully) and mounts the volume READ-ONLY:
  # it can refuse, it cannot damage. The discriminator is `.env`, which is per-COPY of the kit and is
  # gitignored (pattern `deploy/testnet-node/.env`) — a second clone gets a fresh `.env` from
  # `.env.example`, so it does NOT carry the flag and gets refused. That is the whole point: the flag
  # cannot travel with the source.
  # A marker file inside the kit directory would have been the obvious alternative and is WRONG here —
  # build_public_repo.sh copies the WORKING TREE (see its "LOCALLY GENERATED RESIDUE" section), so the
  # marker would ship in the public mirror and every cloner would inherit the operator's identity,
  # disarming the guard for exactly the people it protects.
  # ⚠ ABSENCE IS A REFUSAL, NOT A PASS: an unset flag reads as 0. There is no value of "we could not
  # tell" that lets the node through.
  preflight:
    # Same build/image as `node` on purpose: no second base image to pull, and the image is guaranteed
    # to exist by the time this runs (compose builds every service before it starts any of them).
    build:
      context: ../..
      dockerfile: docker/Dockerfile.node
    image: ${DENDRA_NODE_IMAGE:-dendra/node:latest}
    restart: "no"
    environment:
      # Compose forwards ONLY what it names — an unlisted variable never reaches the container and the
      # guard that depends on it becomes unreachable. Same rule as the escape hatches further down.
      DENDRA_ADOPT_EXISTING_HOME: "${DENDRA_ADOPT_EXISTING_HOME:-0}"
      DENDRA_PROJECT_NAME: "${DENDRA_PROJECT:-dendra-node}"
    volumes:
      - "node-data:/root/.dendra:ro"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        H=/root/.dendra
        if [ ! -e "$$H/config/genesis.json" ] && [ -z "$$(ls -A "$$H/data" 2>/dev/null)" ]; then
          echo "[preflight] no chain home in volume $${DENDRA_PROJECT_NAME}_node-data -> new node, continuing."
          exit 0
        fi
        # Display only, and a DISTINCT sentinel when unreadable: an unreadable config.toml must not
        # print an empty moniker that reads like "nobody's node".
        WHO="$$(grep -m1 '^moniker' "$$H/config/config.toml" 2>/dev/null | cut -d'"' -f2)"
        [ -n "$$WHO" ] || WHO='?'
        if [ "$${DENDRA_ADOPT_EXISTING_HOME:-0}" = "1" ]; then
          echo "[preflight] DENDRA_ADOPT_EXISTING_HOME=1 -> reusing the existing chain home (moniker $$WHO)."
          exit 0
        fi
        echo "[preflight] REFUSING TO START — this would take over a chain home that is already there." >&2
        echo "[preflight]   compose project : $${DENDRA_PROJECT_NAME}" >&2
        echo "[preflight]   volume          : $${DENDRA_PROJECT_NAME}_node-data" >&2
        echo "[preflight]   its moniker     : $$WHO   ('?' = config.toml unreadable, NOT 'none')" >&2
        echo "[preflight]" >&2
        echo "[preflight] Compose keys a project by NAME, not by directory. If that node is not the one" >&2
        echo "[preflight] this kit copy created, starting it here runs YOUR binary against SOMEONE ELSE'S" >&2
        echo "[preflight] chain state and validator key — divergence, and a double-sign is not forgiven." >&2
        echo "[preflight]" >&2
        echo "[preflight] Pick one:" >&2
        echo "[preflight]  a) It IS your node: add  DENDRA_ADOPT_EXISTING_HOME=1  to this directory's .env" >&2
        echo "[preflight]     (once — that file is per-kit-copy and is not published)." >&2
        echo "[preflight]  b) You want a SEPARATE node: set DENDRA_PROJECT / DENDRA_P2P_PORT /" >&2
        echo "[preflight]     DENDRA_RPC_PORT / DENDRA_NODE_IMAGE in .env. A distinct project gets its own" >&2
        echo "[preflight]     volume, so it syncs from scratch." >&2
        echo "[preflight]  c) You are done with that node: docker compose -p $${DENDRA_PROJECT_NAME} down" >&2
        exit 78

  node:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.node
    # Variable so a second, experimental node does not retag the image the FIRST one restarts onto.
    # Measured on this machine: rebuilding this tag from another tree replaced the image the running
    # container had been created from, and the original was gone. `restart:` then brings the live node
    # back on a binary nobody chose.
    image: ${DENDRA_NODE_IMAGE:-dendra/node:latest}
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      CHAIN_ID: "${CHAIN_ID}"
      MONIKER: "${MONIKER}"
      GENESIS_URL: "${GENESIS_URL}"           # operator's public genesis.json
      GENESIS_SHA256: "${GENESIS_SHA256:-}"   # expected sha256 (network-info.txt) -> anti-MITM check of the downloaded genesis
      # Both accept a COMMA-SEPARATED LIST — name every peer the operator publishes, not just the
      # first. node-join.sh substitutes the whole string into config.toml, so a list works as-is.
      SEEDS: "${SEEDS}"                        # <node_id>@<host>:26656,...
      PERSISTENT_PEERS: "${PERSISTENT_PEERS:-}"
      DENDRA_VRF_KEY_FILE: "${DENDRA_VRF_KEY_FILE:-}"   # validator VRF key (vote-extensions), read by dendrad
      # If the operator resets the network (new genesis), this node would otherwise keep running the OLD
      # chain forever, reporting `catching_up: false` while frozen on a dead fork.
      # node-join.sh now refuses to start on that divergence. Set this to 1 to let it wipe the local chain
      # state and resync instead (KEYS ARE KEPT — only the chain data is dropped). Must be listed HERE:
      # compose only forwards the variables it names, so an unlisted escape hatch is unreachable.
      DENDRA_AUTO_RESET_ON_GENESIS_CHANGE: "${DENDRA_AUTO_RESET_ON_GENESIS_CHANGE:-0}"
      # EXPLICIT opt-out of the anti-MITM genesis verification (node-join.sh) — trusted networks ONLY.
      # It must be listed here: compose only forwards the variables it names, so an operator who set the
      # flag in .env would watch the node refuse to start regardless, and look for the cause in the
      # genesis rather than in the compose file.
      DENDRA_ALLOW_UNVERIFIED_GENESIS: "${DENDRA_ALLOW_UNVERIFIED_GENESIS:-0}"
      # STATE-SYNC — required as soon as the chain has taken a consensus-breaking change: replaying the
      # history would recompute an AppHash different from the signed one, and panic. These three values
      # come from the operator's network-info.txt. Left empty they mean ordinary replay (a fresh network,
      # where that is safe). Listed HERE because compose forwards ONLY what it names — an unlisted
      # variable never reaches the container, and the guard depending on it becomes unreachable.
      STATESYNC_RPC: "${STATESYNC_RPC:-}"
      STATESYNC_TRUST_HEIGHT: "${STATESYNC_TRUST_HEIGHT:-}"
      STATESYNC_TRUST_HASH: "${STATESYNC_TRUST_HASH:-}"
    # HOST port on the left, container port on the right. Only the HOST side is a variable: the node
    # listens on 26656/26657 inside the container whatever you publish it as. Defaults are the former
    # literals, so nothing moves for an operator who sets nothing. ⚠ Changing DENDRA_P2P_PORT does NOT
    # change what the node ADVERTISES to peers — it announces the port from `external_address`, which
    # this kit does not manage (see README, "Availability and peer redundancy"). A second node on a
    # different P2P host port is reachable for you and invisible to the network until you set that field.
    ports:
      - "${DENDRA_P2P_PORT:-26656}:26656"   # P2P (inbound: helps the network)
      - "${DENDRA_RPC_PORT:-26657}:26657"   # local RPC
    volumes:
      - "node-data:/root/.dendra"             # persistent chain state
    restart: unless-stopped
    # On SIGTERM the node closes the consensus WAL and four leveldb stores before exiting; docker's
    # default grace period is 10s, after which it sends SIGKILL mid-close. The exact close duration
    # was NOT measured (the node log carries minute granularity only), so this is a CEILING, not a
    # target: docker proceeds as soon as the process exits, and a slow close costs nothing here.
    stop_grace_period: 60s
    # Without this the json-file log grows without bound. Measured on the operator's own node, whose
    # container was created 6 days earlier: 593055 log lines retained, with `LogConfig.Config` empty
    # (no max-size), the last 40000 lines alone weighing 9114885 bytes; a full `docker logs` dump did
    # not complete within 120s. Rotation keeps `docker logs` usable when you need it to diagnose.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  node-data: {}

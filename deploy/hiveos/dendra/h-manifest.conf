# h-manifest.conf -- the HiveOS custom-miner manifest of the Dendra package. HiveOS reads it (it is sourced:
# plain assignments only), and so do this package's scripts.
# deploy/hiveos/build.sh WRITES CUSTOM_VERSION and DENDRA_REF when it builds the archive of a release. They
# are empty in the source tree on purpose: h-run.sh refuses to start a package that names no release tag.
CUSTOM_NAME=dendra
CUSTOM_VERSION=
# The release tag this package installs, and stays on. Updating means installing the package of a newer
# release: h-run.sh never follows a branch and never pulls.
DENDRA_REF=
# Written by h-config.sh from the flight sheet, read by h-run.sh (parsed, never sourced).
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/$CUSTOM_NAME/dendra.conf
CUSTOM_LOG_BASENAME=/var/log/miner/$CUSTOM_NAME/$CUSTOM_NAME

syntax = "proto3";
package dendra.jobs.v1;

option go_package = "github.com/DendraNetwork/dendra-network/chain/x/jobs/types";

// Miner is the on-chain registration of a compute provider: its identity, its bonded stake and the
// public keys everything else is verified against.
message Miner {
  string miner_id = 1;
  string operator = 2;
  string region = 3;
  uint64 stake = 4;
  string creator = 5;
  uint64 demand = 6;
  uint64 subsidy_claimed = 7;
  // X25519 public key (hex, 32 bytes) anchored at registration. Clients encrypt payloads to the key
  // the miner committed to on-chain, never to one handed out by a relay: without this anchor, the
  // party that forwards the job can substitute its own key and read every prompt it carries.
  string enc_pubkey = 8;
  // Ed25519 VRF public key (hex, 32 bytes) anchored at registration. Every ECVRF proof this miner
  // submits (availability challenge, beacon) verifies against it.
  string vrf_pubkey = 9;
}

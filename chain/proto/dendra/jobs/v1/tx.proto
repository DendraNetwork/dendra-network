// MsgProveAvailability is how a miner proves it is available: it answers the CHALLENGE of the
// current epoch, which is the app hash of the epoch boundary block. Because that hash is not known
// before the boundary, an answer cannot be precomputed ahead of the challenge. Signed by the
// miner's OPERATOR.
message MsgProveAvailability {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string miner_id = 2;
  string challenge = 3;
  string vrf_proof = 4; // ECVRF proof over the challenge (hex, 80 bytes). Required when the miner has a vrf_pubkey.
}

// MsgProveAvailabilityResponse defines the MsgProveAvailabilityResponse message.
message MsgProveAvailabilityResponse {}

// MsgSubmitVrfBeacon sets the verifiable VRF seed of a job, sent by the beacon authority.
message MsgSubmitVrfBeacon {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string job_id = 2;
  string vrf_proof = 3; // ECVRF proof (hex, 80 bytes) over job_id, verified against params.vrf_beacon_pubkey.
}

// MsgSubmitVrfBeaconResponse is the response of MsgSubmitVrfBeacon.
message MsgSubmitVrfBeaconResponse {}

// MsgRotateMinerKeys rotates a miner's anchored keys, sent by its operator.
message MsgRotateMinerKeys {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string miner_id = 2;
  string new_enc_pubkey = 3; // Empty leaves the current key unchanged.
  string new_vrf_pubkey = 4; // Empty leaves the current key unchanged.
}

// MsgRotateMinerKeysResponse is the response of MsgRotateMinerKeys.
message MsgRotateMinerKeysResponse {}

// MsgRegisterValidatorVrfKey anchors a VALIDATOR's Ed25519 VRF PUBLIC key on-chain, signed by its
// operator account. Consensus uses that key to VERIFY the validator's VRF vote extensions, which in
// turn feed the decentralized committee seed.
//
// Self-authorizing: a signer anchors its OWN key, and a key registered under any other account is
// never consulted. This stays dormant until vote extensions are enabled at a height.
message MsgRegisterValidatorVrfKey {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string vrf_pubkey = 2; // Ed25519 VRF public key (hex, 32 bytes).
  // Proof of possession: a VRF proof (hex, 80 bytes) over "dendra/vrf-pop/<creator>". Binding the
  // proof to the signer's own address stops a validator from registering a key it does not hold,
  // which would let it disown the vote extensions produced under that key.
  string vrf_pop = 3;
}
// MsgRegisterValidatorVrfKeyResponse is the response of MsgRegisterValidatorVrfKey.
message MsgRegisterValidatorVrfKeyResponse {}

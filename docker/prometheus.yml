global:
  scrape_interval: 5s

# A level never shows a stop. Every Dendra metric is read from the chain, so a chain that stops
# producing does not turn anything red -- it stops changing everything. The rules below watch the rate,
# and a second rule watches the exporter, because a series that vanishes must not read as a series that
# is fine.
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: dendra
    static_configs:
      - targets: ["exporter:9101"]
